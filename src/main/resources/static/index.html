<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <!-- 引入 jQuery（用于Ajax请求） -->
    <script src="https://cdn.staticfile.org/jquery/3.6.0/jquery.min.js"></script>

    <style>

        /* 页面整体样式 */
        body{
            margin:0;
            font-family:"Microsoft YaHei";
            background:#f4f6f9;
        }

        /* 顶部导航栏 */
        .header{
            height:60px;
            background:#4facfe;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 30px;
        }

        /* 页面主体容器 */
        .container{
            width:1100px;
            margin:30px auto;
        }

        /* 卡片样式 */
        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        /* 输入框 */
        input{
            padding:6px;
            margin:5px;
        }

        /* 按钮统一样式 */
        button{
            padding:6px 12px;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }

        /* 不同按钮颜色 */
        .refresh-btn{background:#4facfe;color:white;}
        .add-btn{background:#2ecc71;color:white;}
        .delete-btn{background:#ff6b6b;color:white;}
        .edit-btn{background:#f39c12;color:white;}
        .search-btn{background:#9b59b6;color:white;}
        .batch-btn{background:#e74c3c;color:white;}
        .logout-btn{background:#ff6b6b;color:white;}

        /* 表格样式 */
        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#4facfe;
            color:white;
            padding:10px;
        }

        td{
            text-align:center;
            padding:8px;
        }

        /* 表格斑马纹 */
        tr:nth-child(even){
            background:#f2f2f2;
        }

        /* 头像 */
        img{
            border-radius:50%;
        }
</style>
        </head>
<body>
    <div class="header">
        <h2>student sys</h2>
        <div>
            <span id="count"></span>
            <button onclick="logout()" class="logout-btn">logout</button>
        </div>
    </div>
    <div class="container">
        <div class="card">
            searchName:<input id="searchName">
            <button onclick="searchName()" class="search-btn">search</button>
            <button onclick="loadPage(1)" class="refresh-btn">refresh</button>
        </div>
        <div class="card">
            <h3>add student</h3>
            name:
            <input id="name">
            age:
            <input id="age">
            gender:
            <input id="gender">
            phone:
            <input id="phone">
            avatar:
            <input id="avatarFile" type="file">
            <button onclick="addStudent()" class="add-btn">add</button>
        </div>
        <div class="card">
            <button onclick="batchDelete()" class="batch-btn">batchDelete</button>
            <table>
                <tr>
                    <th><input type="checkbox" onclick="checkAll(this)"></th>
                    <th>ID</th>
                    <th>AVATAR</th>
                    <th>NAME</th>
                    <th>AGE</th>
                    <th>GENDER</th>
                    <th>PHONE</th>
                    <th>OP</th>
                </tr>
                <tbody id="tbody"></tbody>
            </table>
            <br>
            <button onclick="loadPage(page-1)">last page</button>
            <span id="pageInfo"></span>
            <button onclick="loadPage(page+1)">next page</button>
        </div>
    </div>
<script>
    let page=1;
    let size=10;
    function renderTable(list){
        let html="";
        list.forEach(s => {
            html+=`
<tr>
<td>
<input type="checkbox" value="${s.id}" name="check">
</td>
<td>${s.id}</td>
<td>
<img src="${s.avatar}" width="40">
</td>
<td>${s.name}</td>
<td>${s.age||""}</td>
<td>${s.gender||""}</td>
<td>${s.phone||""}</td>
<td>
<button class="edit-btn" onclick="editStudent(${s.id},'${s.name}',${s.age},'${s.gender}','${s.phone}','${s.avatar}')">edit</button>
<button class="delete-btn" onclick="deleteStudent(${s.id})">delete</button>
</td>


</tr>`;
        });
    $("#tbody").html(html);
    }
    function loadPage(p){
        if (p<1) p=1;
        page=p;
        $.get("/api/student/page",{page:page,size:size},function(list){
            renderTable(list);
            $("#pageInfo").text("page:"+page);
        });
        loadCount();
    }
    function searchName(){
        const name=$("#searchName").val();
        $.get("/api/student/search",{name:name},function(list){
            renderTable(list);
        });
    }
    function addStudent(){
        const file=$("#avatarFile")[0].files[0];
        if(file){
            let form=new FormData();
            form.append("avatar",file)
            $.ajax({
                url:"/api/student/upload",
                type:"POST",
                data:form,
                processData:false,
                contentType:false,
                success:function(res){
                    if(!res.success || !res.url){
                        alert(res.msg || "图片上传失败，请重试");
                        return;
                    }
                    saveStudent(res.url);
                },
                error:function(){
                    alert("图片上传失败，请检查登录状态、文件大小或网络后重试");
                }
            });
        }else {
            saveStudent("")
        }
    }
    function saveStudent(avatar){
        const data={
            name:$("#name").val(),
            age:$("#age").val(),
            gender:$("#gender").val(),
            phone:$("#phone").val(),
            avatar:avatar
        };
        $.ajax({
            url:"/api/student/add",
            type:"POST",
            contentType:"application/json",
            data:JSON.stringify(data),

            success:function(res){
                if(!res.success){
                    alert(res.msg || "保存失败，请重试");
                    return;
                }
                alert("Student added successfully!");
                loadPage(page);
            }
        });
    }
    function deleteStudent(id){
        if(!confirm("Are you sure you want to delete this student?"))return ;
        $.post("/api/student/delete",{id:id},function(){
            alert("Deleted successfully!");
            loadPage(page);
        })
    }
    function editStudent(id,name,age,gender,phone,avatar){
        const newName=prompt("Enter name");
        const newAge=prompt("Enter age");
        const newGender=prompt("Enter gender");
        const newPhone=prompt("Enter phone");
        const data={
            id:id,
            name:newName,
            age:newAge,
            gender:newGender,
            phone:newPhone,
            avatar:avatar
        };
        $.ajax({
            url:"/api/student/update",
            type:"POST",
            data:JSON.stringify(data),
            contentType:"application/json",
            success:function(){
                alert("Updated successfully!");
                loadPage(page);
            }
        });
    }
    function batchDelete(){
        let ids=[];
        $("input[name='check']:checked").each(function(){
            ids.push($(this).val());
        });
        if(ids.length==0){
            alert("please choice to delete!");
            return;
        }
        $.ajax({
            url:"/api/student/batchDelete",
            type:"POST",
            contentType:"application/json",
            data:JSON.stringify(ids),
            success:function(){
                alert("Deleted successfully!");
                loadPage(page);
            }
        });
    }
    function checkAll(box){
        $("input[name='check']").prop("checked",box.checked);
    }
    function loadCount(){
        $.get("/api/student/count",function(c){
            $("#count").text("count:"+c);
        })
    }
    function logout(){
        $.get("/api/logout",function(){
            location.href="/login.html";
        });
    }
    loadPage(1);
</script>
</body>
</html>
