<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://cdn.staticfile.org/jquery/3.6.0/jquery.min.js"></script>
    <style>
        *{
            box-sizing:border-box;
        }
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:"Microsoft YaHei",Arial;
            background: linear-gradient(135deg,#667eea,#764ba2);
        }
        /* 注册卡片 */
        .register-box{
            width:380px;
            padding:40px;
            border-radius:15px;
            backdrop-filter: blur(10px);
            background:rgba(255,255,255,0.15);
            box-shadow:0 20px 40px rgba(0,0,0,0.2);
            text-align:center;
            color:white;
        }
        /* 输入框 */
        input{
            position:relative;
            margin-bottom:20px;
            width:100%;
            padding:12px 40px 12px 12px;
            border:none;
            border-radius:8px;
            outline:none;
            font-size:14px;
        }
        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }
        /* 注册按钮 */
        .register-btn{
            background:#2ecc71;
            color:white;
        }
        .register-btn:hover{
            background:#27ae60;
        }
        /* 返回登录 */
        .login-btn{
            margin-top:10px;
            background:white;
            color:#333;
        }
        .login-btn:hover{
            background:#f0f0f0;
        }
    </style>
</head>
<body>
<div class="register-box">
    <input id="username" type="text" placeholder="please enter your username"/>
    <input id="password" type="password" placeholder="please enter your password"/>
    <input id="confirmPassword" type="password" placeholder="please enter your password again"/>
    <button class="register-btn" onclick="doRegister()">register</button>
    <button class="login-btn" onclick="goLogin()">goLogin</button>
</div>
<script>
    function doRegister(){
        let username=$('#username').val();
        let password=$('#password').val();
        let confirmPassword=$('#confirmPassword').val();
        if (username.trim()==="") {
            alert("Please enter a username");
            return;
        }
        if (password.trim()==="") {
            alert("Please enter a password");
            return;
        }
        if (password!==confirmPassword) {
            alert("passwords do not match");
            return;
        }
        $.post("/api/register",{username:username,password:password},function(res){
            if(res.success){
                alert(res.msg);
                location.href="/login.html";
            }else {
                alert(res.msg)
            }
        });
    }
    function goLogin(){
        location.href="/login.html";
    }

</script>
</body>
</html>
